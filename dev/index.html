<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deye Cloud Power Flow Card — dev</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: Roboto, system-ui, -apple-system, sans-serif;
        background: var(--page-bg);
        color: var(--primary-text-color);
        transition: background 0.2s;
      }
      body[data-theme='ha-light'] {
        --page-bg: #fafafa;
        --card-background-color: #ffffff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --primary-color: #03a9f4;
      }
      body[data-theme='ha-dark'],
      body[data-theme='deye'] {
        --page-bg: #111111;
        --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --primary-color: #03a9f4;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-bottom: 16px;
        font-size: 14px;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
      }
      figure {
        margin: 0;
        width: var(--card-width, 400px);
      }
      h2 {
        font-size: 15px;
        font-weight: 600;
        margin: 24px 0 12px;
      }
      .error {
        color: #f05454;
        font-size: 13px;
        padding: 12px;
        border: 1px solid currentColor;
        border-radius: 12px;
      }
      figcaption button {
        margin-left: 6px;
        font-size: 11px;
      }
      figcaption {
        font-size: 12px;
        color: var(--secondary-text-color);
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body data-theme="deye">
    <div class="controls">
      <label>
        Theme
        <select id="theme">
          <option value="deye">theme: deye</option>
          <option value="ha-dark">HA dark</option>
          <option value="ha-light">HA light</option>
        </select>
      </label>
      <label>
        Card width
        <select id="width">
          <option value="320">320 px</option>
          <option value="375">375 px (phone)</option>
          <option value="400" selected>400 px</option>
          <option value="520">520 px</option>
        </select>
      </label>
      <label><input type="checkbox" id="sign" checked /> show_sign</label>
    </div>
    <h2>Reference vs card (demo: day_charge, theme: deye)</h2>
    <div class="grid" id="compare">
      <figure>
        <figcaption>Deye Cloud recording (dev/reference/deye-cloud.jpg, not in git)</figcaption>
        <img src="./reference/deye-cloud.jpg" alt="" style="width: 100%; border-radius: 12px" onerror="this.closest('figure').remove()" />
      </figure>
      <figure>
        <figcaption>Recording: Load panel open</figcaption>
        <img src="./reference/deye-cloud-panel.jpg" alt="" style="width: 100%; border-radius: 12px" onerror="this.closest('figure').remove()" />
      </figure>
    </div>
    <h2>Live — simulated ha-solarman entities (<code>preset: solarman</code>)</h2>
    <div class="grid" id="live"></div>
    <h2>Demo scenarios</h2>
    <div class="grid" id="cards"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
